<!DOCTYPE html>
<!-- $Id: question-sets.html 1146 2017-11-20 15:02:17Z koduya $ -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Questions')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>
<div class="container">
    <div th:replace="fragments/layout :: messages"></div>
    <h1>Question catalogue</h1>
    <p class="text-muted">Changes apply to applications lodged from now on. Lodged applications keep the questions they were lodged with.</p>
    <table class="table table-condensed">
        <thead><tr><th>Load type</th><th>Version</th><th>Questions</th><th>Required</th><th></th></tr></thead>
        <tbody>
        <tr th:each="qs : ${questionSets}">
            <td th:text="${qs.loadTypeCode}">TRANSFORMER</td>
            <td th:text="${qs.version}">1</td>
            <td th:text="${#lists.size(qs.questions)}">4</td>
            <td th:text="${#lists.size(qs.questions.?[mandatory])}">3</td>
            <td><a th:href="@{/admin/questions/{id}(id=${qs.id})}">Edit</a></td>
        </tr>
        </tbody>
    </table>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
