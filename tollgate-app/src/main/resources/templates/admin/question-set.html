<!DOCTYPE html>
<!-- $Id: question-set.html 1146 2017-11-20 15:02:17Z koduya $ -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Questions')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>
<div class="container">
    <div th:replace="fragments/layout :: messages"></div>
    <h1>Questions <small th:text="${questionSet.loadTypeCode}">TRANSFORMER</small></h1>
    <table class="table table-condensed">
        <thead><tr><th>#</th><th>Question</th></tr></thead>
        <tbody>
        <tr th:each="q : ${questionSet.questions}">
            <td th:text="${q.seq}">1</td>
            <td>
                <form th:action="@{/admin/questions/{set}/{id}(set=${questionSet.id},id=${q.id})}" method="post" class="form-inline">
                    <input type="text" class="form-control input-sm" name="questionText" size="80" th:value="${q.questionText}"/>
                    <label class="checkbox-inline"><input type="checkbox" name="mandatory" value="true" th:checked="${q.mandatory}"/> Required</label>
                    <button type="submit" class="btn btn-default btn-sm">Save</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <h3>Add a question</h3>
    <form th:action="@{/admin/questions/{set}/add(set=${questionSet.id})}" method="post" class="form-inline">
        <input type="text" class="form-control" name="questionText" size="80"/>
        <label class="checkbox-inline"><input type="checkbox" name="mandatory" value="true" checked="checked"/> Required</label>
        <button type="submit" class="btn btn-primary">Add</button>
    </form>
    <p><a th:href="@{/admin/questions}">Back to catalogue</a></p>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
