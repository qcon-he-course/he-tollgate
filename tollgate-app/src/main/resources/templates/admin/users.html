<!DOCTYPE html>
<!-- $Id: users.html 1066 2017-09-25 10:27:44Z koduya $ -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Users')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>
<div class="container">
    <div th:replace="fragments/layout :: messages"></div>
    <h1>Staff users</h1>
    <p><a class="btn btn-primary" th:href="@{/admin/users/new}">New user</a></p>
    <input type="text" class="form-control table-filter" data-table="#users" placeholder="Filter"/>
    <table id="users" class="table table-striped table-condensed">
        <thead><tr><th>Username</th><th>Name</th><th>Email</th><th>Roles</th><th>Enabled</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.username}">officer1</td>
            <td th:text="${u.fullName}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${#strings.listJoin(u.roles, ', ')}">OFFICER</td>
            <td th:text="${u.enabled} ? 'Yes' : 'No'">Yes</td>
            <td><a th:href="@{/admin/users/{id}(id=${u.id})}">Edit</a></td>
        </tr>
        </tbody>
    </table>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
