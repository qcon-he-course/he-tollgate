<!DOCTYPE html>
<!-- $Id: hauliers.html 1063 2017-09-21 16:33:09Z rmistry $ -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Hauliers')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>
<div class="container">
    <div th:replace="fragments/layout :: messages"></div>
    <h1>Hauliers</h1>
    <p><a class="btn btn-primary" th:href="@{/admin/hauliers/new}">New haulier</a></p>
    <input type="text" class="form-control table-filter" data-table="#hauliers" placeholder="Filter"/>
    <table id="hauliers" class="table table-striped table-condensed">
        <thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Town</th><th></th></tr></thead>
        <tbody>
        <tr th:each="h : ${hauliers}">
            <td th:text="${h.name}">Name</td>
            <td th:text="${h.contactName}"></td>
            <td th:text="${h.contactEmail}"></td>
            <td th:text="${h.town}"></td>
            <td><a th:href="@{/admin/hauliers/{id}(id=${h.id})}">Edit</a></td>
        </tr>
        </tbody>
    </table>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
