<!DOCTYPE html>
<!-- $Id: structure-edit.html 1055 2017-09-15 15:12:37Z gferrand $ -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Structure')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>
<div class="container">
    <div th:replace="fragments/layout :: messages"></div>
    <h1>Structure <span th:text="${structure.code}">S01</span></h1>
    <form th:action="@{/admin/structures/{id}(id=${structure.id})}" th:object="${structureForm}" method="post" class="form-horizontal">
        <div class="form-group">
            <label class="col-sm-2 control-label">Type</label>
            <div class="col-sm-4"><p class="form-control-static" th:text="${structure.structureType}"></p></div>
        </div>
        <div class="form-group">
            <label class="col-sm-2 control-label" for="name">Name</label>
            <div class="col-sm-4">
                <input type="text" class="form-control" th:field="*{name}"/>
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
        </div>
        <div class="form-group" th:if="${structure.carrying}">
            <label class="col-sm-2 control-label" for="massRatingT">Mass rating (t)</label>
            <div class="col-sm-2">
                <input type="text" class="form-control" th:field="*{massRatingT}"/>
                <span class="field-error" th:if="${#fields.hasErrors('massRatingT')}" th:errors="*{massRatingT}"></span>
            </div>
        </div>
        <div class="form-group" th:unless="${structure.carrying}">
            <label class="col-sm-2 control-label" for="clearanceM">Clearance (m)</label>
            <div class="col-sm-2">
                <input type="text" class="form-control" th:field="*{clearanceM}"/>
                <span class="field-error" th:if="${#fields.hasErrors('clearanceM')}" th:errors="*{clearanceM}"></span>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-4">
                <button type="submit" class="btn btn-primary">Save</button>
                <a class="btn btn-default" th:href="@{/admin/structures}">Cancel</a>
            </div>
        </div>
    </form>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
