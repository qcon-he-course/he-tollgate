<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/layout :: head('Amendments')"></head>
<body>
<nav th:replace="fragments/layout :: nav"></nav>
<div class="container">
    <div th:replace="fragments/layout :: messages"></div>
    <h1>Amendment requests</h1>
    <table class="table table-condensed">
        <thead><tr><th>#</th><th>Permit</th><th>New dates</th><th>Warnings</th><th>Requested</th><th></th></tr></thead>
        <tbody>
        <tr th:each="a : ${amendments}" th:with="p=${permits.?[id == __${a.permitId}__][0]}">
            <td th:text="${a.id}"></td>
            <td><a th:href="@{/permits/{ref}(ref=${p.reference})}" th:text="${p.reference} + ' v' + ${p.version}"></a></td>
            <td th:text="${a.newFirstMoveDate} + ' to ' + ${a.newLastMoveDate}"></td>
            <td th:text="${a.warnings}"></td>
            <td th:text="${a.requestedBy}"></td>
            <td>
                <form th:action="@{/amendments/{id}/approve(id=${a.id})}" method="post" class="inline">
                    <input type="hidden" name="permitReference" th:value="${p.reference}"/>
                    <button type="submit" class="btn btn-success btn-xs">Approve</button>
                </form>
                <form th:action="@{/amendments/{id}/reject(id=${a.id})}" method="post" class="form-inline inline">
                    <input type="hidden" name="permitReference" th:value="${p.reference}"/>
                    <input type="text" name="reason" class="form-control input-sm" placeholder="Reason"/>
                    <button type="submit" class="btn btn-default btn-xs">Reject</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(amendments)}"><td colspan="6" class="text-muted">No requests waiting.</td></tr>
        </tbody>
    </table>
</div>
<footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
